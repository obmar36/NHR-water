<script type="text/babel" data-presets="env,react">
// ScreenAlerts.jsx — anomaly + alert center: filter bar, table, detail/handling panel.

const LEVELS = {
  crit:  { t:'嚴重', en:'Critical', tone:'crit' },
  warn:  { t:'警告', en:'Warning',  tone:'warn' },
  info:  { t:'資訊', en:'Info',     tone:'info' },
};

function LevelTag({ level, solid }) {
  const L = LEVELS[level] || LEVELS.info;
  return <window.Chip tone={L.tone} solid={solid} style={{ minWidth:42, justifyContent:'center' }}>{L.t}</window.Chip>;
}

function StatusBadge({ status }) {
  const map = { '待處理':'crit', '處理中':'warn', '已確認':'info', '已解除':'ok' };
  const tone = map[status] || 'mute';
  const c = window.TONE[tone];
  return <span style={{ display:'inline-flex', alignItems:'center', gap:5, fontSize:11, color:c, fontWeight:600 }}>
    <span style={{ width:6, height:6, borderRadius:999, background:c }}/>{status}</span>;
}

function AlertStats() {
  const A = window.companyData?.getAlerts?.() || window.ALERTS;
  const counts = { crit:0, warn:0, info:0 };
  A.forEach(a => counts[a.level]!=null && counts[a.level]++);
  const open = A.filter(a => a.status==='待處理' || a.status==='處理中').length;
  const items = [
    { label:'未結案', en:'Open', value:open, tone:'crit' },
    { label:'嚴重', en:'Critical', value:counts.crit, tone:'crit' },
    { label:'警告', en:'Warning', value:counts.warn, tone:'warn' },
    { label:'資訊', en:'Info', value:counts.info, tone:'info' },
    { label:'今日總計', en:'Total Today', value:A.length, tone:'mute' },
    { label:'平均處理時間', en:'MTTR', value:'14m', tone:'ok' },
  ];
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(6,1fr)', gap:10, flexShrink:0 }}>
      {items.map((s,i) => (
        <window.Panel key={i} style={{ padding:'10px 13px' }}>
          <div style={{ fontSize:11, color:'var(--fg-2)' }}>{s.label}</div>
          <div style={{ fontSize:9.5, color:'var(--fg-3)', textTransform:'uppercase', letterSpacing:.04, marginBottom:4 }}>{s.en}</div>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:24, fontWeight:700,
            color: s.tone==='mute'?'var(--fg-1)':window.TONE[s.tone] }}>{s.value}</div>
        </window.Panel>
      ))}
    </div>
  );
}

function FilterBar({ filter, setFilter, query, setQuery }) {
  const { Segmented, NHRIcons } = window;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
      <Segmented options={[{value:'all',label:'全部'},{value:'crit',label:'嚴重'},{value:'warn',label:'警告'},{value:'info',label:'資訊'}]}
        value={filter} onChange={setFilter}/>
      <Segmented options={[{value:'open',label:'未結案'},{value:'closed',label:'已結案'},{value:'any',label:'不限'}]}
        value={query.st} onChange={v=>setQuery({...query, st:v})} size="sm"/>
      <div style={{ flex:1 }}/>
      <div style={{ display:'flex', alignItems:'center', gap:7, background:'var(--bg-inset)', border:'1px solid var(--border-hairline)',
        borderRadius:7, padding:'6px 10px', width:220 }}>
        <span style={{ width:14, height:14, color:'var(--fg-3)' }}><NHRIcons.Search/></span>
        <input placeholder="搜尋設備 / 參數 / 編號" value={query.q} onChange={e=>setQuery({...query, q:e.target.value})}
          style={{ all:'unset', flex:1, fontSize:12, color:'var(--fg-1)', fontFamily:'var(--font-sans)' }}/>
      </div>
      <window.HeaderAction icon={<NHRIcons.Download/>}>匯出 CSV</window.HeaderAction>
    </div>
  );
}

function AlertTable({ rows, selId, onSelect }) {
  const cols = ['等級','時間','設備 / 系統','異常類型','異常值','門檻 / 預測','狀態','處理人'];
  return (
    <window.Panel style={{ flex:1, minHeight:0 }}>
      <div style={{ flex:1, overflow:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
          <thead style={{ position:'sticky', top:0, zIndex:1 }}>
            <tr style={{ background:'var(--bg-topbar)' }}>
              {cols.map((c,i) => (
                <th key={i} style={{ textAlign:i>=4&&i<=5?'right':'left', padding:'10px 12px', fontSize:10.5, fontWeight:600,
                  color:'var(--fg-3)', textTransform:'uppercase', letterSpacing:.04, borderBottom:'1px solid var(--border-hairline)', whiteSpace:'nowrap' }}>{c}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(a => {
              const on = a.id===selId;
              return (
                <tr key={a.id} onClick={()=>onSelect(a.id)} style={{ cursor:'pointer',
                  background: on ? 'var(--bg-elevated)' : 'transparent', borderLeft: on ? '2px solid var(--nhr-red)' : '2px solid transparent' }}
                  onMouseEnter={e=>{ if(!on) e.currentTarget.style.background='var(--bg-inset)'; }}
                  onMouseLeave={e=>{ if(!on) e.currentTarget.style.background='transparent'; }}>
                  <td style={{ padding:'9px 12px', borderBottom:'1px solid var(--border-hairline)' }}><LevelTag level={a.level}/></td>
                  <td style={{ padding:'9px 12px', borderBottom:'1px solid var(--border-hairline)', fontFamily:'var(--font-mono)', color:'var(--fg-2)', whiteSpace:'nowrap' }}>{a.t}</td>
                  <td style={{ padding:'9px 12px', borderBottom:'1px solid var(--border-hairline)', color:'var(--fg-1)', fontWeight:500, whiteSpace:'nowrap' }}>{a.dev}</td>
                  <td style={{ padding:'9px 12px', borderBottom:'1px solid var(--border-hairline)', color:'var(--fg-2)', whiteSpace:'nowrap' }}>{a.type}</td>
                  <td style={{ padding:'9px 12px', borderBottom:'1px solid var(--border-hairline)', textAlign:'right', fontFamily:'var(--font-mono)', fontWeight:700, color:'var(--fg-1)', whiteSpace:'nowrap' }}>{a.val}</td>
                  <td style={{ padding:'9px 12px', borderBottom:'1px solid var(--border-hairline)', textAlign:'right', fontFamily:'var(--font-mono)', color:'var(--fg-3)', whiteSpace:'nowrap' }}>{a.thr}</td>
                  <td style={{ padding:'9px 12px', borderBottom:'1px solid var(--border-hairline)' }}><StatusBadge status={a.status}/></td>
                  <td style={{ padding:'9px 12px', borderBottom:'1px solid var(--border-hairline)', color:'var(--fg-2)', whiteSpace:'nowrap' }}>{a.owner}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </window.Panel>
  );
}

function AlertDetail({ alert }) {
  const { Panel, PanelHeader, NHRIcons } = window;
  if (!alert) return null;
  const L = LEVELS[alert.level];
  const steps = [
    { t:'偵測', who:'AI 引擎', time:alert.t, done:true },
    { t:'通知推播', who:'LINE · 值班群組', time:alert.t, done:true },
    { t:'人員確認', who:alert.owner!=='—'?alert.owner:'待認領', time:alert.owner!=='—'?'+2m':'—', done:alert.owner!=='—' },
    { t:'處理 / 結案', who:'—', time:'—', done:alert.status==='已解除' },
  ];
  return (
    <Panel style={{ width:340, flexShrink:0, minHeight:0 }}>
      <PanelHeader dot={L.tone} icon={<NHRIcons.Warn/>} title={`告警 ${alert.id}`} sub={alert.type}/>
      <div style={{ flex:1, overflow:'auto', padding:13, display:'flex', flexDirection:'column', gap:12 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <LevelTag level={alert.level} solid/>
          <StatusBadge status={alert.status}/>
          <span style={{ flex:1 }}/>
          <span style={{ fontSize:11, color:'var(--fg-3)', fontFamily:'var(--font-mono)' }}>{alert.t}</span>
        </div>
        {/* key/value */}
        <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
          {[['設備 / 系統', alert.dev],['異常參數', alert.param],['異常值', alert.val],['門檻 / 預測值', alert.thr],['異常類型', alert.type],['通知對象', 'LINE 值班群組 · 現場 3 人']].map(([k,v],i) => (
            <div key={i} style={{ display:'flex', justifyContent:'space-between', gap:10, padding:'7px 11px', background:'var(--bg-inset)', borderRadius:6 }}>
              <span style={{ fontSize:11.5, color:'var(--fg-2)' }}>{k}</span>
              <span style={{ fontSize:12, color:'var(--fg-1)', fontFamily:'var(--font-mono)', fontWeight:500, textAlign:'right' }}>{v}</span>
            </div>
          ))}
        </div>
        {/* AI cause */}
        <div style={{ padding:'10px 12px', borderRadius:8, background:'linear-gradient(180deg, rgba(139,92,246,.10), rgba(139,92,246,.02))', border:'1px solid rgba(139,92,246,.25)' }}>
          <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:6 }}>
            <span style={{ width:14, height:14, color:'var(--ov-violet)', display:'inline-flex' }}><NHRIcons.Brain/></span>
            <span style={{ fontSize:11.5, fontWeight:700, color:'#C4B5FD' }}>AI 研判與節能建議</span>
          </div>
          <div style={{ fontSize:11.5, color:'var(--fg-1)', lineHeight:1.55 }}>{alert.note}。可能原因為進氣濾網阻塞;建議清潔濾網並複查比能耗。預估改善後可降低約 <b style={{ fontFamily:'var(--font-mono)', color:'#C4B5FD' }}>4.8%</b> 用電。</div>
          <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:8, fontSize:10.5, color:'var(--fg-3)' }}>
            <span style={{ width:12, height:12 }}><NHRIcons.Lock/></span> 建議僅供參考,不會自動變更 PLC 或設備參數
          </div>
        </div>
        {/* handling timeline */}
        <div>
          <div style={{ fontSize:11, color:'var(--fg-3)', textTransform:'uppercase', letterSpacing:.04, marginBottom:8 }}>處理流程</div>
          <div style={{ display:'flex', flexDirection:'column', gap:0 }}>
            {steps.map((s,i) => (
              <div key={i} style={{ display:'flex', gap:10 }}>
                <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
                  <span style={{ width:16, height:16, borderRadius:999, background: s.done?'var(--status-ok)':'var(--bg-inset)',
                    border:`1px solid ${s.done?'var(--status-ok)':'var(--border-strong)'}`, display:'flex', alignItems:'center', justifyContent:'center',
                    color:'#06210F' }}>{s.done && <span style={{ width:9, height:9 }}><NHRIcons.Check/></span>}</span>
                  {i<steps.length-1 && <span style={{ width:1, flex:1, minHeight:18, background:'var(--border-hairline)' }}/>}
                </div>
                <div style={{ paddingBottom:14 }}>
                  <div style={{ fontSize:12, color: s.done?'var(--fg-1)':'var(--fg-2)', fontWeight:600 }}>{s.t}</div>
                  <div style={{ fontSize:10.5, color:'var(--fg-3)', fontFamily:'var(--font-mono)' }}>{s.who} · {s.time}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div style={{ display:'flex', gap:8, padding:'10px 13px', borderTop:'1px solid var(--border-hairline)' }}>
        <button style={btnPrimary}>認領處理</button>
        <button style={btnGhost}>標記已解除</button>
      </div>
    </Panel>
  );
}

const btnPrimary = { all:'unset', cursor:'pointer', flex:1, textAlign:'center', padding:'9px 0', borderRadius:7,
  background:'var(--nhr-red)', color:'#fff', fontSize:12.5, fontWeight:600 };
const btnGhost = { all:'unset', cursor:'pointer', flex:1, textAlign:'center', padding:'9px 0', borderRadius:7,
  background:'var(--bg-inset)', border:'1px solid var(--border-strong)', color:'var(--fg-1)', fontSize:12.5, fontWeight:600 };

function ScreenAlerts() {
  const alerts = window.companyData?.getAlerts?.() || window.ALERTS;
  const [filter, setFilter] = React.useState('all');
  const [query, setQuery] = React.useState({ q:'', st:'any' });
  const [selId, setSelId] = React.useState(alerts[0]?.id);
  React.useEffect(() => {
    if (!alerts.some(a => a.id === selId)) setSelId(alerts[0]?.id);
  }, [alerts.length, selId]);
  const rows = alerts.filter(a => {
    if (filter!=='all' && a.level!==filter) return false;
    const open = a.status==='待處理'||a.status==='處理中';
    if (query.st==='open' && !open) return false;
    if (query.st==='closed' && open) return false;
    if (query.q && !(a.dev+a.param+a.id+a.type).toLowerCase().includes(query.q.toLowerCase())) return false;
    return true;
  });
  const sel = alerts.find(a => a.id===selId);
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:10, padding:12, height:'100%', minHeight:0 }}>
      <AlertStats/>
      <FilterBar filter={filter} setFilter={setFilter} query={query} setQuery={setQuery}/>
      <div style={{ display:'flex', gap:10, flex:1, minHeight:0 }}>
        <AlertTable rows={rows} selId={selId} onSelect={setSelId}/>
        <AlertDetail alert={sel}/>
      </div>
    </div>
  );
}

window.ScreenAlerts = ScreenAlerts;

</script>
<script type="text/babel" data-presets="env,react">
// ScreenMessaging.jsx — §12 通訊軟體整合: platform connect, notification rules, templates, send log.

function Switch({ on, onClick }) {
  return (
    <button onClick={onClick} style={{ all:'unset', cursor:'pointer', width:36, height:20, borderRadius:999, flexShrink:0,
      background: on?'var(--status-ok)':'var(--border-strong)', position:'relative', transition:'background .15s' }}>
      <span style={{ position:'absolute', top:2, left: on?18:2, width:16, height:16, borderRadius:999, background:'#fff', transition:'left .15s var(--ease-std)' }}/>
    </button>

}

function getMessagingContract() {

function ScreenChat() {
  const { NHRIcons } = window;
  const [msgs, setMsgs] = React.useState([
    { role:'ai', text:'您好,我是節能分析助理。我可以查詢即時設備狀態、能源使用、異常原因,或從操作手冊與 SOP 找到故障排除建議。請問需要什麼協助?', sources:[] },
  ]);
  const [input, setInput] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const scrollRef = React.useRef(null);
  React.useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [msgs]);

  const ask = async (q) => {
    if (!q.trim() || busy) return;
    setInput(''); setBusy(true);
    setMsgs(m => [...m, { role:'user', text:q }, { role:'ai', typing:true }]);
    const minDelay = new Promise(r => setTimeout(r, 650));
    // 透過統一 API 介面取得回覆（接上貴司 LLM/RAG 後自動切換為真實服務）
    const res = await window.askLLM(q, { scope:'manager' });
    await minDelay;
    setMsgs(m => { const c=[...m]; c[c.length-1]={ role:'ai', text:res.answer, sources:res.sources||[] }; return c; });
    setBusy(false);
  };

  return (
    <div style={{ display:'flex', gap:10, padding:12, height:'100%', minHeight:0 }}>
      <window.Panel style={{ flex:1, minHeight:0 }}>

              fontSize:11.5, color:'var(--fg-2)', padding:'5px 11px', borderRadius:999, background:'var(--bg-inset)',
              border:'1px solid var(--border-hairline)', opacity:busy?.5:1 }}
              onMouseEnter={e=>{ if(!busy){ e.currentTarget.style.background='var(--bg-elevated)'; e.currentTarget.style.color='var(--fg-1)'; }}}
              onMouseLeave={e=>{ e.currentTarget.style.background='var(--bg-inset)'; e.currentTarget.style.color='var(--fg-2)'; }}>{s}</button>
          ))}
        </div>
        {/* input */}
        <div style={{ padding:'12px 14px', display:'flex', gap:9, alignItems:'center' }}>
          <div style={{ flex:1, display:'flex', alignItems:'center', gap:9, background:'var(--bg-inset)', border:'1px solid var(--border-strong)',
            borderRadius:10, padding:'10px 14px' }}>
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') ask(input); }}
              placeholder="以中文提問,例如:今天用電量是否異常?" disabled={busy}
              style={{ all:'unset', flex:1, fontSize:13, color:'var(--fg-1)', fontFamily:'var(--font-sans)' }}/>
            <span style={{ fontSize:10, color:'var(--fg-3)', fontFamily:'var(--font-mono)' }}>↵</span>
          </div>
          <button onClick={()=>ask(input)} disabled={busy||!input.trim()} style={{ all:'unset', cursor:busy||!input.trim()?'default':'pointer',
            width:42, height:42, borderRadius:10, background: input.trim()&&!busy?'var(--nhr-red)':'var(--bg-inset)',
            display:'flex', alignItems:'center', justifyContent:'center', color: input.trim()&&!busy?'#fff':'var(--fg-3)',
            border:'1px solid', borderColor: input.trim()&&!busy?'var(--nhr-red)':'var(--border-hairline)' }}>
            <span style={{ width:18, height:18 }}><NHRIcons.Send/></span>
          </button>
        </div>
      </window.Panel>
      <KbPanel/>
    </div>
  );
}

function ScreenGovernance() {

        gridTemplateColumns:stacked ? '1fr' : 'minmax(560px, 1.15fr) minmax(420px, .85fr)',

window.ScreenGovernance = ScreenGovernance;

</script>
<script type="text/babel" data-presets="env,react">
// App.jsx — root: chrome + view router.

if (!window.ScreenGovernance) {
  function ScreenGovernanceFallback() {
    const { Panel, PanelHeader, Chip, NHRIcons } = window;
    const rows = [
      ['1-5', '目的 / 定位 / 系統架構', '已覆蓋', '已在導覽、管理者與現場端、資料層與應用層呈現。'],
      ['6', '資料整合', '待接線', '已呈現 SQL Server、OPC UA、MQTT、CSV、Tag 字典與品質碼；真實連線與補傳紀錄待後端。'],
      ['7', '即時監控與視覺化', '已覆蓋', 'KPI、趨勢圖、製程流程、預測 vs 實際、異常標記已具備。'],
      ['8', 'AI 分析與建模', '已覆蓋', '圖形化建模流程、模型清單、評估指標、黃金曲線、節能建議已具備。'],
      ['9', '異常偵測與告警', '已覆蓋', '異常類型、告警等級、告警紀錄、處理流程已具備。'],
      ['10', '報表', '已覆蓋', '6 種報表、手動產生、排程、下載、推播已具備。'],
      ['11', 'LLM / RAG', '待接線', '對話窗、RAG 來源卡、公司 api-tool 端口已預留；本地模型與知識庫待接。'],
      ['12', '通訊軟體', '待接線', 'LINE / Telegram、通知規則、模板與發送紀錄已具備；Webhook 與 Token 待後端。'],
      ['13', '使用者與權限', '待接線', 'RBAC、MFA、稽核紀錄已具備；正式登入授權待接。'],
      ['14', '資安', '已補強', '新增 OT/IT 分區、LLM 讀取權限、資料保護與知識庫版本檢核。'],
      ['15', '部署環境', '已補強', '新增邊緣主機、私有化部署、離線核心功能與備份裝置檢核。'],
      ['16', '非功能需求', '已補強', '新增資料延遲、載入時間、查詢時間、模型推論、通知送達、備份還原檢核。'],
      ['17', '驗收標準', '已補強', '新增資料整合、AI 模型、通知、LLM、資安驗收矩陣。'],
    ];
    const tone = (s) => s === '已覆蓋' || s === '已補強' ? 'ok' : 'warn';
    const cards = [
      ['可展示', '前端已能支持需求確認與管理者審核。', 'ok'],
      ['可交後端', '已具備 company action 格式與 mock endpoint。', 'info'],
      ['不可直接上線', '真實資料、權限、模型、通訊與資安驗收仍待接。', 'warn'],
    ];
    return (
      <div style={{ display:'flex', flexDirection:'column', gap:10, padding:12, height:'100%', minHeight:0, overflow:'auto' }}>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10 }}>
          {cards.map(([t,d,c], i) => (
            <Panel key={i} style={{ padding:'12px 14px' }}>
              <div style={{ display:'flex', alignItems:'center', gap:9 }}>
                <span style={{ width:32, height:32, borderRadius:9, background:`${window.TONE[c]}22`, color:window.TONE[c], display:'flex', alignItems:'center', justifyContent:'center' }}>
                  <span style={{ width:17, height:17 }}>{c === 'warn' ? <NHRIcons.Warn/> : <NHRIcons.Check/>}</span>
                </span>
                <div>
                  <div style={{ fontSize:13.5, fontWeight:700, color:'var(--fg-1)' }}>{t}</div>
                  <div style={{ fontSize:11.5, color:'var(--fg-2)' }}>{d}</div>
                </div>
              </div>
            </Panel>
          ))}
        </div>
        <Panel style={{ minHeight:460 }}>
          <PanelHeader dot="info" icon={<NHRIcons.FileText/>} title="逐項規格審核矩陣" sub="AI節能分析管理平台功能規格書 v1.0"/>
          <div style={{ flex:1, overflow:'auto' }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
              <thead style={{ position:'sticky', top:0, zIndex:1 }}>
                <tr style={{ background:'var(--bg-topbar)' }}>
                  {['章節','需求項目','狀態','管理者審核意見'].map((h,i)=>(<th key={i} style={{ textAlign:'left', padding:'10px 12px', color:'var(--fg-3)', borderBottom:'1px solid var(--border-hairline)', whiteSpace:'nowrap' }}>{h}</th>))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i)=>(
                  <tr key={i}>
                    <td style={cellMono}>{r[0]}</td>
                    <td style={cellStrong}>{r[1]}</td>
                    <td style={cell}><Chip tone={tone(r[2])} solid={tone(r[2])==='ok'}>{r[2]}</Chip></td>
                    <td style={cell}>{r[3]}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Panel>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <Panel>
            <PanelHeader dot="ok" icon={<NHRIcons.Shield/>} title="§14 資安 / §15 部署" sub="Go-live controls"/>
            <div style={{ padding:13, display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              {['OT/IT 分區與受控導管','LLM 僅讀取不控制 PLC','依角色限制 RAG 回答','Prompt Injection 後端防護','邊緣主機與私有化部署','離線核心功能保留'].map((x,i)=>(<div key={i} style={pill}>{x}</div>))}
            </div>
          </Panel>
          <Panel>
            <PanelHeader dot="warn" icon={<NHRIcons.Clock/>} title="§16 非功能 / §17 驗收" sub="NFR & Acceptance"/>
            <div style={{ padding:13, display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              {['儀表板載入 < 3 秒目標','歷史查詢 < 5 秒目標','通知送達 < 60 秒目標','LLM 回應時間需實測','資料庫 / 模型 / 設定 / RAG 備份','資料、AI、通知、LLM、資安驗收'].map((x,i)=>(<div key={i} style={pill}>{x}</div>))}
            </div>
          </Panel>
        </div>
      </div>
    );
  }
  const cell = { padding:'9px 12px', borderBottom:'1px solid var(--border-hairline)', color:'var(--fg-2)', lineHeight:1.45, verticalAlign:'top' };
  const cellStrong = { ...cell, color:'var(--fg-1)', fontWeight:600, whiteSpace:'nowrap' };
  const cellMono = { ...cell, color:'var(--status-info)', fontFamily:'var(--font-mono)', fontWeight:700, whiteSpace:'nowrap' };
  const pill = { padding:'9px 10px', borderRadius:8, background:'var(--bg-inset)', color:'var(--fg-2)', fontSize:11.5, lineHeight:1.45 };
  window.ScreenGovernance = ScreenGovernanceFallback;
}

function App() {
  const [view, setView] = React.useState('overview');
  const viewport = window.useViewport ? window.useViewport() : { isMobile:false };
  const isMobile = viewport.isMobile;
  const alerts = window.companyData?.getAlerts?.() || window.ALERTS;
  const alertCount = alerts.filter(a => a.status==='待處理' || a.status==='處理中').length;

  let Screen = null;
  if (view==='overview') Screen = <window.ScreenOverview onGoAlerts={()=>setView('alerts')}/>;
  else if (view==='data') Screen = <window.ScreenData/>;
  else if (view==='modeling') Screen = <window.ScreenModeling/>;
  else if (view==='reports') Screen = <window.ScreenReports/>;
  else if (view==='alerts') Screen = <window.ScreenAlerts/>;
  else if (view==='messaging') Screen = <window.ScreenMessaging/>;
  else if (view==='access') Screen = <window.ScreenAccess/>;
  else if (view==='field') Screen = <window.ScreenField/>;
  else if (view==='chat') Screen = <window.ScreenChat/>;
  else if (view==='governance') Screen = <window.ScreenGovernance/>;

  return (
    <div style={{ display:'flex', flexDirection:isMobile ? 'column' : 'row', height:'100vh', width:'100vw', overflow:'hidden', background:'var(--bg-page)' }}>
      {!isMobile && <window.LeftRail active={view} onSelect={setView} alertCount={alertCount}/>}
      <div style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0, minHeight:0 }}>
        <window.TopBar view={view} mobile={isMobile}/>
        <div style={{ flex:1, minHeight:0, minWidth:0 }}>{Screen}</div>
      </div>
      {isMobile && <window.LeftRail active={view} onSelect={setView} alertCount={alertCount} mobile/>}
    </div>
  );
}

window.App = App;

</script>
<script type="text/babel" data-presets="env,react">
  ReactDOM.createRoot(document.getElementById('root')).render(<window.App/>);
</script>
