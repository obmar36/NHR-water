/* Brand sans — Poppins (Latin) + Noto Sans TC (CJK). Files in /fonts. */
:root {
  /* ---------- Brand ---------- */
  --nhr-red:        #E40613;   /* corporate mark, threat */
  --nhr-red-600:    #C40510;
  --nhr-red-300:    #FF4A55;

  --bg-page:        #0B1220;   /* outermost canvas */

  /* ---------- Borders ---------- */
  --border-hairline:#1F2A44;

  --border-focus:   #3B82F6;

  /* ---------- Foreground (text) ---------- */
  --fg-1:           #E6ECF5;   /* primary text, headings */
  --fg-2:           #9AA7BD;   /* secondary, labels */
  --fg-3:           #5C6A82;   /* tertiary, disabled, meta */

  /* ---------- Status ---------- */
  --status-ok:      #22C55E;
  --status-ok-bg:   rgba(34,197,94,.18);
  --status-warn:    #F59E0B;
  --status-warn-bg: rgba(245,158,11,.18);

  --status-info:    #22D3EE;
  --status-info-bg: rgba(34,211,238,.18);

  /* ---------- Analytics overlay fills (drawn over video) ---------- */
  --ov-violet:      rgba(139, 92,246,.55);
  --ov-magenta:     rgba(217, 70,239,.55);
  --ov-lime:        rgba(132,204, 22,.55);
  --ov-cyan:        rgba( 34,211,238,.45);
  --ov-threat:      rgba(239, 68, 68,.35);

  /* ---------- Bounding-box stroke ---------- */
  --bbox-ok:        #22C55E;
  --bbox-crit:      #EF4444;
  --bbox-info:      #22D3EE;
  --bbox-lpr:       #84CC16;

  /* ---------- Type ---------- */
  --font-sans:      'Poppins', 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono:      'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;

  --fs-meta:        11px;   /* timestamps, footnotes */
  --fs-body:        13px;   /* default ui body */
  --fs-label:       12px;   /* secondary labels */
  --fs-panel:       14px;   /* panel header */
  --fs-page:        16px;   /* page title in top bar */
  --fs-stat:        18px;   /* numerical stat value */
  --fs-stat-lg:     22px;   /* hero stats */

  --lh-tight:       1.2;
  --lh-normal:      1.4;

  --fw-regular:     400;
  --fw-medium:      500;
  --fw-semibold:    600;
  --fw-bold:        700;

  /* ---------- Radius ---------- */
  --radius-chip:    4px;
  --radius-inset:   6px;
  --radius-video:   8px;
  --radius-card:   10px;
  --radius-pill:   999px;

  /* ---------- Spacing (8-pt grid) ---------- */
  --space-1:  4px;
  --space-2:  8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* ---------- Elevation (top inner-highlight only — no blurred shadows) ---------- */
  --elev-card:    inset 0 1px 0 rgba(255,255,255,.04);
  --elev-hover:   inset 0 1px 0 rgba(255,255,255,.06);

  /* ---------- Motion ---------- */
  --ease-std:    cubic-bezier(.4, 0, .2, 1);
  --dur-fast:    80ms;
  --dur-base:    150ms;
  --dur-slow:    300ms;

  /* ---------- Layout ---------- */
  --rail-w:      52px;
  --topbar-h:    44px;
}

/* ============================================================
   Semantic primitives — use these, not raw vars, where possible
   ============================================================ */

.nhr-page {
  background: var(--bg-page);
  color: var(--fg-1);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
}

.nhr-h1 {
  font-size: var(--fs-page);
  font-weight: var(--fw-bold);
  letter-spacing: .01em;
  color: var(--fg-1);
  margin: 0;
}
.nhr-h2 {
  font-size: var(--fs-panel);
  font-weight: var(--fw-semibold);
  color: var(--fg-1);
  margin: 0;
}
.nhr-label {
  font-size: var(--fs-label);
  color: var(--fg-2);
  font-weight: var(--fw-medium);
}
.nhr-meta {
  font-size: var(--fs-meta);
  color: var(--fg-3);
}
.nhr-mono {
  font-family: var(--font-mono);
  font-feature-settings: 'tnum' 1, 'zero' 1;
}
.nhr-stat {
  font-family: var(--font-mono);
  font-size: var(--fs-stat);
  font-weight: var(--fw-bold);
  color: var(--fg-1);
}

.nhr-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-card);
  box-shadow: var(--elev-card);
}
.nhr-inset {
  background: var(--bg-inset);
  border-radius: var(--radius-inset);
}

.nhr-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: var(--radius-chip);
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  font-weight: var(--fw-semibold);
  background: var(--bg-inset);
  color: var(--fg-1);
  line-height: 1.4;
}
.nhr-chip--ok    { background: var(--status-ok);   color: #06210F; }
.nhr-chip--crit  { background: var(--status-crit); color: #2A0606; }
.nhr-chip--warn  { background: var(--status-warn); color: #2A1B06; }
.nhr-chip--info  { background: var(--status-info); color: #062327; }
.nhr-chip--mute  { background: var(--bg-inset);    color: var(--fg-2); }

.nhr-divider { color: var(--fg-3); margin: 0 8px; }

<script type="text/babel" data-presets="env,react">
// Atomic primitives — forked from the NHR dashboard kit, extended for energy/water analytics.

const TONE = {
  mute: '#9AA7BD', ok: '#22C55E', crit: '#EF4444', warn: '#F59E0B',
  info: '#22D3EE', violet: '#8B5CF6', lime: '#84CC16', magenta: '#D946EF',
};

function Chip({ tone = 'mute', solid = false, children, style }) {
  const c = TONE[tone] || TONE.mute;
  const solidFg = { ok:'#06210F', crit:'#FFFFFF', warn:'#2A1B06', info:'#062327', mute:'#0B1220', violet:'#fff', lime:'#16210A', magenta:'#fff' }[tone];
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4, padding:'2px 7px',
      borderRadius:4, fontFamily:'var(--font-mono)', fontSize:11, fontWeight:700,
      lineHeight:1.45, whiteSpace:'nowrap',
      background: solid ? c : `${c}22`,
      color: solid ? solidFg : c,
      ...style,
    }}>{children}</span>
  );
}

function Dot({ tone = 'info', size = 8, glow = true }) {
  const c = TONE[tone] || TONE.info;
  return <span style={{ width:size, height:size, borderRadius:999, background:c, flexShrink:0,
    boxShadow: glow ? `0 0 6px ${c}` : 'none' }}/>;
}

function Panel({ children, style, pad = false, ...props }) {
  return (
    <div style={{
      background:'var(--bg-panel)', border:'1px solid var(--border-hairline)',
      borderRadius:10, boxShadow:'inset 0 1px 0 rgba(255,255,255,.04)',
      display:'flex', flexDirection:'column', minHeight:0, minWidth:0,

function PanelHeader({ icon, dot, title, sub, right }) {

function HeaderAction({ icon, children, onClick, active }) {

// KPI hero card — big mono number, label, delta, sparkline slot
function KpiCard({ icon, label, en, value, unit, delta, deltaTone = 'ok', accent = 'info', spark, tooltip, onClick, active = false }) {

        </div>
        {delta != null && (

        )}

// Small stat (label + value) used in dense rows
function Stat({ label, value, unit, tone = 'mute', mono = true }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:2, minWidth:0 }}>
      <span style={{ fontSize:10.5, color:'var(--fg-3)', whiteSpace:'nowrap' }}>{label}</span>

        {unit && <span style={{ fontSize:10.5, color:'var(--fg-3)' }}>{unit}</span>}
      </span>
    </div>
  );
}

// Segmented control
function Segmented({ options, value, onChange, size = 'md' }) {
  const pad = size==='sm' ? '4px 9px' : '5px 12px';
  const fs = size==='sm' ? 11 : 12;
  return (
    <div style={{ display:'inline-flex', background:'var(--bg-inset)', borderRadius:7, padding:2, gap:2, border:'1px solid var(--border-hairline)' }}>
      {options.map(o => {
        const v = typeof o === 'string' ? o : o.value;
        const lbl = typeof o === 'string' ? o : o.label;
        const on = v === value;
        return (
          <button key={v} onClick={()=>onChange(v)} style={{
            all:'unset', cursor:'pointer', padding:pad, fontSize:fs, borderRadius:5,
            fontWeight: on?600:500, color: on?'var(--fg-1)':'var(--fg-2)',
            background: on?'var(--bg-elevated)':'transparent',
            boxShadow: on?'inset 0 1px 0 rgba(255,255,255,.06)':'none',
            whiteSpace:'nowrap', transition:'all .12s',
          }}>{lbl}</button>
        );
      })}
    </div>
  );
}

// Horizontal meter bar
function Meter({ percent, tone = 'ok', width = 90, height = 6 }) {
  const c = TONE[tone];
  return (
    <span style={{ width, height, borderRadius:999, background:'var(--border-hairline)', overflow:'hidden', display:'inline-block', flexShrink:0 }}>
      <span style={{ display:'block', height:'100%', width:Math.min(100,Math.max(0,percent))+'%', background:c, borderRadius:999, transition:'width .4s var(--ease-std)' }}/>
    </span>
  );
}

// Radial gauge (SVG) — for efficiency / load
function Gauge({ value, max = 100, label, unit, tone = 'info', size = 124 }) {
  const c = TONE[tone];
  const r = 42, cx = 50, cy = 50;
  const start = 135, sweep = 270; // degrees
  const frac = Math.min(1, Math.max(0, value/max));
  const pol = (deg) => { const a = (deg-90)*Math.PI/180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  const arc = (from, to) => {
    const [x1,y1] = pol(from), [x2,y2] = pol(to);
    const large = (to-from) % 360 > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
  };
  return (
    <div style={{ position:'relative', width:size, height:size }}>
      <svg viewBox="0 0 100 100" style={{ width:'100%', height:'100%' }}>
        <path d={arc(start, start+sweep)} fill="none" stroke="var(--border-hairline)" strokeWidth="7" strokeLinecap="round"/>
        <path d={arc(start, start+sweep*frac)} fill="none" stroke={c} strokeWidth="7" strokeLinecap="round"
          style={{ filter:`drop-shadow(0 0 4px ${c}88)`, transition:'all .5s var(--ease-std)' }}/>
      </svg>
      <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:1 }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:24, fontWeight:700, color:'var(--fg-1)', lineHeight:1 }}>{value}<span style={{ fontSize:12, color:'var(--fg-2)' }}>{unit}</span></span>
        <span style={{ fontSize:10.5, color:'var(--fg-3)', textAlign:'center' }}>{label}</span>
      </div>
    </div>
  );
}

function useViewport() {
  const read = () => ({
    width: window.innerWidth || 1280,
    height: window.innerHeight || 800,
  });
  const [viewport, setViewport] = React.useState(read);
  React.useEffect(() => {
    const onResize = () => setViewport(read());
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return {
    ...viewport,
    isMobile: viewport.width < 720,
    isTablet: viewport.width >= 720 && viewport.width < 1100,
  };
}

window.TONE = TONE;
Object.assign(window, { Chip, Dot, Panel, PanelHeader, HeaderAction, KpiCard, Stat, Segmented, Meter, Gauge, InfoHint, useViewport });

</script>
<script type="text/babel" data-presets="env,react">
// Charts.jsx — lightweight SVG charts. No external libs.

// Build a smooth-ish polyline path from [0..1] normalized points
function linePath(pts, w, h, padX = 0) {
  const innerW = w - padX*2;
  return pts.map((v,i) => {
    const x = padX + (i/(pts.length-1))*innerW;
    const y = h - v*h;
    return `${i===0?'M':'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');
}

function Sparkline({ data, w = 84, h = 26, tone = 'info', fill = true }) {
  const c = (window.TONE)[tone];
  const min = Math.min(...data), max = Math.max(...data);
  const norm = data.map(v => max===min ? .5 : (v-min)/(max-min)*.86+.07);
  const d = linePath(norm, w, h);
  const id = React.useId();
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h} style={{ display:'block', overflow:'visible' }}>
      {fill && <>
        <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={c} stopOpacity=".28"/><stop offset="1" stopColor={c} stopOpacity="0"/>
        </linearGradient></defs>
        <path d={`${d} L ${w} ${h} L 0 ${h} Z`} fill={`url(#${id})`} stroke="none"/>
      </>}
      <path d={d} fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

// Multi-series line chart with optional confidence band + event markers.
// series: [{ data:[...], tone, label, dash }]; band: { lo:[...], hi:[...], tone }
function LineChart({ series, band, events = [], height = 220, yLabel, yMax, yMin, xTicks, markers }) {
  const wrapRef = React.useRef(null);
  const [w, setW] = React.useState(600);
  React.useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(es => setW(es[0].contentRect.width));
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);
  const padL = 38, padR = 12, padT = 12, padB = 24;
  const h = height;
  const innerW = Math.max(10, w - padL - padR);
  const innerH = h - padT - padB;
  const all = series.flatMap(s => s.data).concat(band ? band.lo.concat(band.hi) : []);
  const lo = yMin != null ? yMin : Math.min(...all);
  const hi = yMax != null ? yMax : Math.max(...all);
  const span = hi-lo || 1;
  const X = (i, n) => padL + (i/(n-1))*innerW;
  const Y = (v) => padT + innerH - ((v-lo)/span)*innerH;
  const path = (data) => data.map((v,i) => `${i===0?'M':'L'} ${X(i,data.length).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const TONE = window.TONE;
  const yGrid = 4;
  return (
    <div ref={wrapRef} style={{ width:'100%' }}>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} style={{ display:'block' }}>
        {/* grid + y labels */}
        {Array.from({length:yGrid+1}).map((_,i) => {
          const v = lo + (span*i/yGrid);
          const y = Y(v);
          return <g key={i}>
            <line x1={padL} y1={y} x2={w-padR} y2={y} stroke="var(--border-hairline)" strokeWidth="1" strokeDasharray={i===0?'':'2 4'}/>
            <text x={padL-6} y={y+3} textAnchor="end" fontSize="9.5" fill="var(--fg-3)" fontFamily="var(--font-mono)">{Math.round(v)}</text>
          </g>;
        })}
        {/* x ticks */}
        {xTicks && xTicks.map((t,i) => (
          <text key={i} x={X(i, xTicks.length)} y={h-7} textAnchor="middle" fontSize="9.5" fill="var(--fg-3)" fontFamily="var(--font-mono)">{t}</text>
        ))}
        {/* confidence band */}
        {band && (
          <path d={`${band.hi.map((v,i)=>`${i===0?'M':'L'} ${X(i,band.hi.length)} ${Y(v)}`).join(' ')} ${band.lo.slice().reverse().map((v,i)=>`L ${X(band.lo.length-1-i,band.lo.length)} ${Y(v)}`).join(' ')} Z`}
            fill={`${TONE[band.tone||'violet']}1c`} stroke="none"/>
        )}
        {/* vertical event markers */}
        {markers && markers.map((m,i) => (
          <g key={i}>
            <line x1={X(m.i, m.n)} y1={padT} x2={X(m.i, m.n)} y2={padT+innerH} stroke={TONE[m.tone||'crit']} strokeWidth="1" strokeDasharray="3 3" opacity=".7"/>
            <circle cx={X(m.i, m.n)} cy={padT+6} r="3" fill={TONE[m.tone||'crit']}/>
          </g>
        ))}
        {/* series */}
        {series.map((s,si) => (
          <path key={si} d={path(s.data)} fill="none" stroke={TONE[s.tone]} strokeWidth={s.width||2}
            strokeDasharray={s.dash||''} strokeLinecap="round" strokeLinejoin="round"
            style={{ filter: s.glow ? `drop-shadow(0 0 3px ${TONE[s.tone]}66)` : 'none' }}/>
        ))}
      </svg>
    </div>
  );
}

function BarChart({ data, height = 150, tone = 'info', labels, compareTone, baseline }) {
  const wrapRef = React.useRef(null);
  const [w, setW] = React.useState(400);
  React.useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(es => setW(es[0].contentRect.width));
    ro.observe(wrapRef.current); return () => ro.disconnect();
  }, []);
  const TONE = window.TONE;
  const padL = 30, padR = 8, padT = 8, padB = 20;
  const innerW = Math.max(10, w-padL-padR), innerH = height-padT-padB;
  const max = Math.max(...data.map(d => Array.isArray(d) ? Math.max(...d) : d)) * 1.1;
  const n = data.length;
  const slot = innerW/n;
  return (
    <div ref={wrapRef} style={{ width:'100%' }}>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} style={{ display:'block' }}>
        {[0,.5,1].map((f,i) => {
          const y = padT+innerH-innerH*f;
          return <g key={i}>
            <line x1={padL} y1={y} x2={w-padR} y2={y} stroke="var(--border-hairline)" strokeDasharray={f===0?'':'2 4'}/>
            <text x={padL-5} y={y+3} textAnchor="end" fontSize="9" fill="var(--fg-3)" fontFamily="var(--font-mono)">{Math.round(max*f)}</text>
          </g>;
        })}
        {baseline != null && (
          <line x1={padL} y1={padT+innerH-(baseline/max)*innerH} x2={w-padR} y2={padT+innerH-(baseline/max)*innerH}
            stroke={TONE.violet} strokeWidth="1.5" strokeDasharray="5 3"/>
        )}
        {data.map((d,i) => {
          const vals = Array.isArray(d) ? d : [d];
          const bw = Math.min(26, slot*.5);
          const x0 = padL + slot*i + slot/2;
          return <g key={i}>
            {vals.map((v,vi) => {
              const bh = (v/max)*innerH;
              const tn = vi===0 ? tone : compareTone;
              const bx = vals.length>1 ? x0 - bw + vi*bw : x0 - bw/2;
              return <rect key={vi} x={bx} y={padT+innerH-bh} width={bw-2} height={bh} rx="2" fill={TONE[tn]} opacity={vi===0?1:.55}/>;
            })}
            {labels && <text x={x0} y={height-6} textAnchor="middle" fontSize="9" fill="var(--fg-3)" fontFamily="var(--font-mono)">{labels[i]}</text>}
          </g>;
        })}
      </svg>
    </div>
  );
}

function Donut({ value, max = 100, tone = 'ok', size = 60, stroke = 7, label }) {
  const TONE = window.TONE;
  const c = TONE[tone];
  const r = (size-stroke)/2, circ = 2*Math.PI*r;
  const frac = Math.min(1, value/max);
  return (
    <div style={{ position:'relative', width:size, height:size }}>
      <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border-hairline)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={c} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={`${circ*frac} ${circ}`} style={{ transition:'stroke-dasharray .5s var(--ease-std)' }}/>
      </svg>
      <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        fontFamily:'var(--font-mono)', fontSize:size>54?14:12, fontWeight:700, color:'var(--fg-1)' }}>{label!=null?label:value}</div>
    </div>
  );
}

Object.assign(window, { Sparkline, LineChart, BarChart, Donut });

</script>
<script type="text/babel" data-presets="env,react">
// Charts2.jsx — analysis charts: scatter+regression, histogram, heatmap, stacked breakdown.

function useWidth(initial = 400) {
  const ref = React.useRef(null);
  const [w, setW] = React.useState(initial);
  React.useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(es => setW(es[0].contentRect.width));
    ro.observe(ref.current); return () => ro.disconnect();
  }, []);
  return [ref, w];
}

// Scatter with optional least-squares regression line.
// points: [[x,y],...]; xLabel/yLabel; regression: boolean
function ScatterChart({ points, height = 220, tone = 'info', regTone = 'lime', xLabel, yLabel, regression = true }) {
  const [ref, w] = useWidth(500);
  const TONE = window.TONE;
  const padL = 40, padR = 14, padT = 12, padB = 28;
  const innerW = Math.max(10, w-padL-padR), innerH = height-padT-padB;
  const xs = points.map(p=>p[0]), ys = points.map(p=>p[1]);
  const xmin=Math.min(...xs), xmax=Math.max(...xs), ymin=Math.min(...ys), ymax=Math.max(...ys);
  const xpad=(xmax-xmin)*.08||1, ypad=(ymax-ymin)*.08||1;
  const X=v=>padL+((v-(xmin-xpad))/((xmax+xpad)-(xmin-xpad)))*innerW;
  const Y=v=>padT+innerH-((v-(ymin-ypad))/((ymax+ypad)-(ymin-ypad)))*innerH;
  // regression
  let line=null, r2=null;
  if (regression && points.length>1) {
    const n=points.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0);
    const sxy=points.reduce((a,[x,y])=>a+x*y,0), sxx=xs.reduce((a,x)=>a+x*x,0);
    const m=(n*sxy-sx*sy)/(n*sxx-sx*sx), b=(sy-m*sx)/n;
    const ym=sy/n; const ssTot=ys.reduce((a,y)=>a+(y-ym)**2,0);
    const ssRes=points.reduce((a,[x,y])=>a+(y-(m*x+b))**2,0);
    r2=1-ssRes/ssTot;
    line={ x1:X(xmin-xpad), y1:Y(m*(xmin-xpad)+b), x2:X(xmax+xpad), y2:Y(m*(xmax+xpad)+b) };
  }
  return (
    <div ref={ref} style={{ width:'100%' }}>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} style={{ display:'block' }}>
        {[0,.25,.5,.75,1].map((f,i)=>{ const y=padT+innerH-innerH*f; const v=(ymin-ypad)+((ymax+ypad)-(ymin-ypad))*f;
          return <g key={i}><line x1={padL} y1={y} x2={w-padR} y2={y} stroke="var(--border-hairline)" strokeDasharray={f===0?'':'2 4'}/>
            <text x={padL-5} y={y+3} textAnchor="end" fontSize="9" fill="var(--fg-3)" fontFamily="var(--font-mono)">{v.toFixed(v<10?2:0)}</text></g>; })}
        {line && <line x1={line.x1} y1={line.y1} x2={line.x2} y2={line.y2} stroke={TONE[regTone]} strokeWidth="2" strokeDasharray="6 4" opacity=".9"/>}
        {points.map((p,i)=>(<circle key={i} cx={X(p[0])} cy={Y(p[1])} r="3.4" fill={TONE[tone]} opacity=".82" stroke="var(--bg-panel)" strokeWidth="1"/>))}
        {xLabel && <text x={padL+innerW/2} y={height-6} textAnchor="middle" fontSize="9.5" fill="var(--fg-3)">{xLabel}</text>}
        {yLabel && <text x={12} y={padT+innerH/2} textAnchor="middle" fontSize="9.5" fill="var(--fg-3)" transform={`rotate(-90 12 ${padT+innerH/2})`}>{yLabel}</text>}
        {r2!=null && <text x={w-padR-4} y={padT+12} textAnchor="end" fontSize="10.5" fill={TONE[regTone]} fontFamily="var(--font-mono)" fontWeight="700">R² = {r2.toFixed(3)}</text>}
      </svg>
    </div>
  );
}

// Histogram / distribution. data: raw values; bins count
function Histogram({ data, bins = 12, height = 180, tone = 'violet', xLabel, mean, target }) {
  const [ref, w] = useWidth(400);
  const TONE = window.TONE;
  const padL=30, padR=10, padT=10, padB=26;
  const innerW=Math.max(10,w-padL-padR), innerH=height-padT-padB;
  const min=Math.min(...data), max=Math.max(...data), span=(max-min)||1;
  const counts=new Array(bins).fill(0);
  data.forEach(v=>{ let b=Math.floor((v-min)/span*bins); if(b>=bins) b=bins-1; counts[b]++; });
  const cmax=Math.max(...counts);
  const bw=innerW/bins;
  const X=v=>padL+((v-min)/span)*innerW;
  return (
    <div ref={ref} style={{ width:'100%' }}>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} style={{ display:'block' }}>
        {counts.map((c,i)=>{ const bh=(c/cmax)*innerH; return (
          <rect key={i} x={padL+bw*i+1} y={padT+innerH-bh} width={bw-2} height={bh} rx="2" fill={TONE[tone]} opacity={.78}/>); })}
        <line x1={padL} y1={padT+innerH} x2={w-padR} y2={padT+innerH} stroke="var(--border-hairline)"/>
        {mean!=null && <g><line x1={X(mean)} y1={padT} x2={X(mean)} y2={padT+innerH} stroke={TONE.ok} strokeWidth="1.5" strokeDasharray="4 3"/>
          <text x={X(mean)} y={padT+9} textAnchor="middle" fontSize="9" fill={TONE.ok} fontFamily="var(--font-mono)">均值</text></g>}
        {target!=null && <g><line x1={X(target)} y1={padT} x2={X(target)} y2={padT+innerH} stroke={TONE.warn} strokeWidth="1.5" strokeDasharray="4 3"/>
          <text x={X(target)} y={padT+9} textAnchor="middle" fontSize="9" fill={TONE.warn} fontFamily="var(--font-mono)">基準</text></g>}
        <text x={padL} y={height-6} fontSize="9" fill="var(--fg-3)" fontFamily="var(--font-mono)">{min.toFixed(2)}</text>
        <text x={w-padR} y={height-6} textAnchor="end" fontSize="9" fill="var(--fg-3)" fontFamily="var(--font-mono)">{max.toFixed(2)}</text>
        {xLabel && <text x={padL+innerW/2} y={height-6} textAnchor="middle" fontSize="9.5" fill="var(--fg-3)">{xLabel}</text>}
      </svg>
    </div>
  );
}

// Heatmap: rows × cols matrix of intensity 0..1. rowLabels, colLabels
function Heatmap({ matrix, rowLabels, colLabels, height = 200, tone = 'info', title }) {
  const [ref, w] = useWidth(500);
  const TONE = window.TONE;
  const padL=42, padT=4, padB=18, padR=8;
  const rows=matrix.length, cols=matrix[0].length;
  const cw=(w-padL-padR)/cols, ch=(height-padT-padB)/rows;
  const base=TONE[tone];
  return (
    <div ref={ref} style={{ width:'100%' }}>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} style={{ display:'block' }}>
        {matrix.map((row,r)=>row.map((v,c)=>(
          <rect key={`${r}-${c}`} x={padL+c*cw+1} y={padT+r*ch+1} width={cw-2} height={ch-2} rx="2"
            fill={base} fillOpacity={0.12+v*0.8}/>
        )))}
        {rowLabels.map((l,r)=>(<text key={r} x={padL-6} y={padT+r*ch+ch/2+3} textAnchor="end" fontSize="9" fill="var(--fg-3)" fontFamily="var(--font-mono)">{l}</text>))}
        {colLabels.map((l,c)=>((c%2===0)&&<text key={c} x={padL+c*cw+cw/2} y={height-5} textAnchor="middle" fontSize="8.5" fill="var(--fg-3)" fontFamily="var(--font-mono)">{l}</text>))}
      </svg>
    </div>
  );
}

// Horizontal stacked breakdown bar. segments: [{label,value,tone}]
function StackBreakdown({ segments, height = 14 }) {
  const TONE = window.TONE;
  const total = segments.reduce((a,s)=>a+s.value,0);
  return (
    <div>
      <div style={{ display:'flex', height, borderRadius:999, overflow:'hidden', background:'var(--border-hairline)' }}>
        {segments.map((s,i)=>(<div key={i} title={`${s.label} ${s.value}`} style={{ width:`${s.value/total*100}%`, background:TONE[s.tone] }}/>))}
      </div>
      <div style={{ display:'flex', flexWrap:'wrap', gap:'6px 14px', marginTop:9 }}>
        {segments.map((s,i)=>(
          <span key={i} style={{ display:'inline-flex', alignItems:'center', gap:6, fontSize:11 }}>
            <span style={{ width:9, height:9, borderRadius:2, background:TONE[s.tone] }}/>
            <span style={{ color:'var(--fg-2)' }}>{s.label}</span>
            <span style={{ fontFamily:'var(--font-mono)', color:'var(--fg-1)', fontWeight:600 }}>{Math.round(s.value/total*100)}%</span>
          </span>
        ))}
      </div>
    </div>
  );
}

// Multi-segment donut. segments: [{label,value,tone}]
function PieDonut({ segments, size = 132, stroke = 18 }) {
  const TONE = window.TONE;
  const total = segments.reduce((a,s)=>a+s.value,0);
  const r=(size-stroke)/2, circ=2*Math.PI*r;
  let offset=0;
  return (
    <div style={{ position:'relative', width:size, height:size }}>
      <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border-hairline)" strokeWidth={stroke}/>
        {segments.map((s,i)=>{ const len=s.value/total*circ; const el=(
          <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={TONE[s.tone]} strokeWidth={stroke}
            strokeDasharray={`${len} ${circ-len}`} strokeDashoffset={-offset}/>); offset+=len; return el; })}
      </svg>
      <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:20, fontWeight:700, color:'var(--fg-1)', lineHeight:1 }}>{total.toLocaleString()}</span>
        <span style={{ fontSize:9.5, color:'var(--fg-3)' }}>kW 總計</span>
      </div>
    </div>
  );
}

Object.assign(window, { ScatterChart, Histogram, Heatmap, StackBreakdown, PieDonut });

  function fmtNumber(value, digits = 0) {
    const n = toNumber(value);
    if (n === null) return '—';
    return n.toLocaleString('en-US', {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits,
    });
  }

  function signedPct(value) {
    const n = toNumber(value);
    if (n === null) return '—';
    return `${n > 0 ? '+' : ''}${n.toFixed(1)}%`;
  }

  function stateFromStatusClass(statusClass) {
    if (statusClass === 'urgent') return 'crit';
    if (statusClass === 'important' || statusClass === 'warning') return 'warn';
    if (statusClass === 'info') return 'info';
    return 'ok';
  }

  function normalizePlant(snapshot = window.COMPANY_API_SNAPSHOT) {
    const fallback = getPlant();
    const summary = snapshot?.summary?.data || {};
    const k = summary.kpi || {};
    const model = summary.model || {};
    const processRows = snapshot?.processStatus?.data || [];
    const deviceRows = snapshot?.deviceList?.data || [];
    const stages = processRows.length ? processRows.map(row => ({
      id: row.process_id,
      name: row.name,
      en: row.name_en || row.process_id,
      kw: row.main_value,
      flow: row.sub_metrics?.flow_or_quality || '',
      state: stateFromStatusClass(row.status_class),
    })) : fallback.stages;
    const equipment = deviceRows.length ? deviceRows.map(row => {
      const value = row.value || {};
      return {
        id: row.code || row.imei_short || row.imei,
        name: row.name,
        en: row.sub_type || row.type,
        kw: value.power_kw ?? 0,
        load: value.load_pct ?? 0,
        rpm: value.speed_rpm ?? 0,
        eff: value.efficiency_pct ?? 0,
        dev: signedPct(value.deviation_pct),
        state: stateFromStatusClass(row.status_class),
        model: value.model || row.sub_type || row.type,
      };
    }) : fallback.equipment;

    return {
      ...fallback,
      name: summary.site?.site_name || fallback.name,
      en: summary.site?.site_name_en || fallback.en,
      line: summary.site?.site_line || fallback.line,
      kpis: {
        power: { value: fmtNumber(k.realtime_power_kw), unit: 'kW', delta: '+2.4%', tone:'warn', label:'即時總用電', en:'Real-time Power' },
        today: { value: fmtNumber(k.energy_today_mwh, 1), unit: 'MWh', delta: '-6.8%', tone:'ok', label:'今日累計用電', en:'Energy Today' },
        sec: { value: fmtNumber(k.specific_energy_kwh_m3, 3), unit: 'kWh/m³', delta: '-6.8%', tone:'ok', label:'噸水電耗', en:'Specific Energy' },
        output: { value: fmtNumber(k.flow_now_m3h), unit: 'm³/h', delta: '+1.2%', tone:'info', label:'即時出水量', en:'Water Output' },
        saving: { value: fmtNumber(k.saving_rate_pct, 1), unit: '%', delta: 'vs 0.305', tone:'ok', label:'節能率 vs 基準', en:'Saving vs Baseline' },
        co2: { value: fmtNumber(k.co2_today_t, 1), unit: 't', delta: '-6.8%', tone:'ok', label:'今日碳排', en:'CO₂ Today' },
      },
      stages,
      equipment,
      modelKpi: model,
    };
  }

  function normalizeAlerts(snapshot = window.COMPANY_API_SNAPSHOT) {
    const rows = snapshot?.alarmList?.data || [];
    if (!rows.length) return window.ALERTS || [];
    return rows.map(row => ({
      id: row.alarm_id,
      t: String(row.time || '').slice(11, 19) || row.time || '',
      dev: row.device,
      param: row.parameter,
      val: row.value,
      thr: row.threshold,
      level: row.severity || 'info',
      type: row.alarm_type,
      status: row.status_text,
      owner: row.owner || '—',
      note: row.note || '',
    }));
  }

  function normalizeModels(snapshot = window.COMPANY_API_SNAPSHOT) {
    const rows = snapshot?.modelStatus?.data || [];

      id: row.model_id,
      name: row.name,
      en: row.name_en || row.name,
      type: row.model_type,
      algo: row.algorithm,
      metric: row.metric,
      score: row.score,
      state: row.status_text,
      ver: row.version,
      train: row.train_range || 'To be confirmed',
      by: row.owner || 'To be confirmed',
      updated: row.updated_at,
    }));
  }

  function normalizeSample(snapshot = window.COMPANY_API_SNAPSHOT) {
    const fallback = getSample();
    const reportRows = snapshot?.reportSummary?.data || [];

      String(row.co2_t),
      row.peak_power_kw,
    ])) : fallback.dailySummary;
    return {
      ...fallback,
      dailySummary,
      format: {
        ...(fallback.format || {}),
        files: (fallback.format?.files || []).map(file => (
          file.name === 'energy_daily_summary.csv' ? { ...file, rows: dailySummary.length } : file
        )),
      },
    };
  }

  function getSummary(snapshot = window.COMPANY_API_SNAPSHOT) {
    return snapshot?.summary?.data || {};
  }

  function snapshotData(key, fallback) {
    const data = window.COMPANY_API_SNAPSHOT?.[key]?.data;
    return data === undefined ? fallback : data;
  }

  async function request(action, payload = {}, options = {}) {
    const cfg = window.COMPANY_PANEL_CONFIG || baseConfig;
    const useLive = options.live ?? cfg.enabled;
    if (useLive && cfg.actionEndpoint) {
      const body = new URLSearchParams();
      body.set('m', action);
      Object.entries(payload || {}).forEach(([key, value]) => {
        body.set(key, typeof value === 'object' ? JSON.stringify(value) : String(value));
      });
      const res = await fetch(cfg.actionEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
        body,
      });
      return res.json();
    }

    const handler = handlers[action];
    if (!handler) {
      return { rs: 0, rsi: 404, m: action, data: [], error: `Unknown action: ${action}` };
    }
    return handler(payload);
  }

  window.companyApi = {
    request,
    envelope,
    handlers,
    version: COMPANY_API_ADAPTER_VERSION,
    getConfig: () => window.COMPANY_PANEL_CONFIG,
    describe: () => ({
      contract: window.COMPANY_PANEL_CONFIG.contract,
      mode: window.COMPANY_PANEL_CONFIG.enabled ? 'live' : 'mock',
      actionCount: Object.keys(handlers).length,
      actions: Object.keys(handlers).sort(),
    }),
    buildSnapshot: () => ({
      summary: getWaterworksSummary(),
      siteList: getWaterworksSiteList(),
      deviceList: getWaterworksDeviceList(),
      deviceGeo: getWaterworksDeviceGeo(),
      processStatus: getWaterworksProcessStatus(),
      tagLatest: getWaterworksTagLatest(),
      alarmList: getWaterworksAlarmList(),
      modelStatus: getWaterworksModelStatus(),
      reportSummary: getWaterworksReportSummary(),
      governanceStatus: getWaterworksGovernanceStatus(),
      notificationConfig: getWaterworksNotificationConfig(),
      notificationRules: getWaterworksNotificationRules(),
      notificationLog: getWaterworksNotificationLog(),
      rbacMatrix: getWaterworksRbacMatrix(),
      userList: getWaterworksUserList(),
      auditLog: getWaterworksAuditLog(),
      fieldMobileState: getWaterworksFieldMobileState(),
    }),
  };

  window.COMPANY_API_SNAPSHOT = window.companyApi.buildSnapshot();
  window.companyData = {
    getSnapshot: () => window.COMPANY_API_SNAPSHOT,
    getSummary,
    getSites: () => window.WATERWORKS_SITES || [],
    getPlant: () => normalizePlant(),
    getAlerts: () => normalizeAlerts(),
    getModels: () => normalizeModels(),
    getSample: () => normalizeSample(),
    getMessaging: () => ({
      config: snapshotData('notificationConfig', {}),
      rules: snapshotData('notificationRules', []),
      sendLog: snapshotData('notificationLog', []),
    }),
    getAccess: () => ({
      roles: snapshotData('rbacMatrix', {})?.roles || [],
      permissions: snapshotData('rbacMatrix', {})?.permissions || [],
      users: snapshotData('userList', []),
      auditLog: snapshotData('auditLog', []),
    }),
    getFieldMobile: () => snapshotData('fieldMobileState', {}),
  };
  setCompanyDataset('companyAdapterReady', 'true');
  setCompanyDataset('companyActionCount', Object.keys(handlers).length);
  } catch (err) {
    window.COMPANY_API_ADAPTER_ERROR = {
      name: err && err.name,
      message: err && err.message,
      stack: err && String(err.stack || '').slice(0, 1200),
    };
    setCompanyDataset('companyAdapterReady', 'false');
    setCompanyDataset('companyAdapterError', `${err && err.name}: ${err && err.message}`);
    if (console && console.error) console.error('[companyApiAdapter] init failed', window.COMPANY_API_ADAPTER_ERROR);
  }
})();

</script>

  systemPrompt: '你是自來水廠節能分析平台的 RAG 助理。只依檢索到的知識庫與授權資料回答,繁體中文、簡潔專業。涉及操作建議時須提醒不會自動變更 PLC 或設備參數。',
};
if (document && document.documentElement) {
  document.documentElement.dataset.aiTransport = window.LLM_CONFIG.transport;
}

// 統一的問答呼叫:有設定就打真實 API,否則用內建示範資料 / window.claude 後援。
// 回傳 { answer:string, sources:[{doc,loc,p}] }
window.askLLM = async function askLLM(question, ctx = {}) {
  const cfg = window.LLM_CONFIG;
  // 1) 真實 API（接上後啟用）
  if (cfg && cfg.enabled && cfg.chatEndpoint && !cfg.chatEndpoint.includes('<')) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), cfg.timeoutMs);
    try {
      if (cfg.transport === 'company-api-tool') {
        let sources = [];
        let queryResult = null;
        if (cfg.ragEndpoint && !cfg.ragEndpoint.includes('<')) {
          const qr = await fetch(cfg.ragEndpoint, {
            method:'POST', signal:ctrl.signal,
            headers:{ 'Content-Type':'application/json', ...(cfg.apiKey ? { 'Authorization':`Bearer ${cfg.apiKey}` } : {}) },
            body: JSON.stringify({
              content: question,
              question,
              plantId: ctx.plantId || 'WTP2',
              scope: ctx.scope || 'manager',
            }),
          });
          if (qr.ok) {
            queryResult = await qr.json();
            if (queryResult.sql) {
              sources.push({ doc:'公司資料查詢', loc:'query_v2', p:'SQL 已由後端權限過濾' });
            }
            const rawSources = queryResult.sources || queryResult.documents || queryResult.data?.sources || [];
            sources = sources.concat(rawSources.map(s => ({
              doc: s.doc || s.title || s.source || '知識庫',
              loc: s.loc || s.section || s.chunk || '',
              p: s.p || s.page || '',
            })));
          }
        }

        const cr = await fetch(cfg.chatEndpoint, {
          method:'POST', signal:ctrl.signal,
          headers:{ 'Content-Type':'application/json', ...(cfg.apiKey ? { 'Authorization':`Bearer ${cfg.apiKey}` } : {}) },
          body: JSON.stringify({
            mode: 'json',
            content: question,
            scope: ctx.scope || 'manager',
            plantId: ctx.plantId || 'WTP2',
            context: queryResult,
          }),
        });
        clearTimeout(timer);
        const cj = await cr.json();
        const answer =
          cj.choices?.[0]?.message?.content ||
          cj.answer ||
          cj.message ||
          cj.data?.answer ||
          queryResult?.message ||
          '';
        const replySources = cj.sources || cj.documents || cj.data?.sources || [];
        sources = sources.concat(replySources.map(s => ({
          doc: s.doc || s.title || s.source || '知識庫',
          loc: s.loc || s.section || s.chunk || '',
          p: s.p || s.page || '',
        })));
        return { answer: String(answer || '已完成查詢,但 AI 服務未回傳文字內容。').trim(), sources, live:true };
      }

      // 1a) 先取 RAG 來源（可選）
      let sources = [];
      if (cfg.ragEndpoint && !cfg.ragEndpoint.includes('<')) {
        const rr = await fetch(cfg.ragEndpoint, {
          method:'POST', signal:ctrl.signal,
          headers:{ 'Content-Type':'application/json', ...(cfg.apiKey ? { 'Authorization':`Bearer ${cfg.apiKey}` } : {}) },
          body: JSON.stringify({
            question,
            query: question,
            top_k: 4,
            plantId: ctx.plantId || 'WTP2',
            scope: ctx.scope || 'manager',
            returnSources: true,
          }),
        });
        if (rr.ok) {
          const rj = await rr.json();
          // 預期格式:{ sources:[{ doc, loc, p }] } — 依貴司回傳調整對應
          sources = (rj.sources || rj.documents || []).map(s => ({
            doc: s.doc || s.title || s.source, loc: s.loc || s.section || s.chunk || '', p: s.p || s.page || '',
          }));
        }
      }
      // 1b) 對話補全（OpenAI 相容格式）
      const cr = await fetch(cfg.chatEndpoint, {
        method:'POST', signal:ctrl.signal,
        headers:{ 'Content-Type':'application/json', ...(cfg.apiKey ? { 'Authorization':`Bearer ${cfg.apiKey}` } : {}) },
        body: JSON.stringify({
          model: cfg.model,
          plantId: ctx.plantId || 'WTP2',
          scope: ctx.scope || 'manager',
          temperature: cfg.temperature,
          max_tokens: cfg.maxTokens,
          stream: false,
          messages: [
            { role:'system', content: cfg.systemPrompt },
            ...(sources.length ? [{ role:'system', content:'檢索到的知識:\n'+sources.map(s=>`[${s.doc} ${s.loc} ${s.p}]`).join('\n') }] : []),
            { role:'user', content: question },
          ],
        }),
      });
      clearTimeout(timer);
      const cj = await cr.json();
      const answer = cj.choices?.[0]?.message?.content || cj.answer || cj.text || '';
      return { answer: String(answer).trim(), sources, live:true };
    } catch (err) {
      clearTimeout(timer);
      return { answer:'⚠ 無法連線至 AI 服務,請確認端點與金鑰設定。('+(err.name||'error')+')', sources:[], error:true };
    }
  }

  // 2) 內建示範問答（接 API 前的 demo 後援）
  const canned = window.CHAT_CANNED && window.CHAT_CANNED[question];
  if (canned) return { answer: canned.answer, sources: canned.sources, demo:true };

  // 3) window.claude 後援（原型環境）
  try {
    if (window.claude && window.claude.complete) {
      const out = await window.claude.complete((cfg?.systemPrompt||'')+'\n問題:'+question+'\n(限120字內)');
      return { answer:String(out).trim(), sources:[{ doc:'系統操作手冊', loc:'即時資料 API', p:'live' }], demo:true };
    }
  } catch {}
  return { answer:'依目前資料,該項目運作正常。如需更詳細的設備或能耗資訊,請指定設備編號或時間範圍。', sources:[], demo:true };
};

</script>
<script type="text/babel" data-presets="env,react">

// ─────────────────────────────────────────────────────────────

function IOSStatusBar({ dark = false, time = '9:41' }) {

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>

}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',

      <div style={{

        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',

      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>
<script type="text/babel" data-presets="env,react">

const NAV = [

      }
      setText(String(out).trim().replace(/^["「『]|["」』]$/g,'')); setAgo(0);
    } catch { /* keep fallback */ } finally { setBusy(false); }

  React.useEffect(() => { const id = setInterval(()=>setAgo(a=>a+1), 1000); return ()=>clearInterval(id); }, []);
  return (

          animation:`nhrPulse ${busy?.6:1.6}s ease-in-out infinite` }}/>
        AI 值班摘要
      </span>
      <span style={{ flex:1, fontSize:12.5, color:'var(--fg-1)', fontWeight:500, lineHeight:1.4 }}>{text}</span>
      <button onClick={refresh} disabled={busy} style={{ all:'unset', cursor:busy?'wait':'pointer', flexShrink:0,
        fontSize:11, color:'var(--fg-2)', padding:'4px 10px', borderRadius:5, border:'1px solid var(--border-strong)',
        background:'var(--bg-inset)', display:'inline-flex', alignItems:'center', gap:5, opacity:busy?.6:1, fontFamily:'var(--font-mono)',
        alignSelf:viewport.isMobile ? 'flex-start' : 'auto' }}>

  );
}

const KPI_SPARKS = {

    { key:'co2',    d:k.co2,    icon:<I.Leaf/>,  accent:k.co2?.tone === 'warn' ? 'warn' : 'ok', spark:<Sparkline data={KPI_SPARKS.co2} tone={k.co2?.tone === 'warn' ? 'warn' : 'ok'}/> },
  ];

}

function currentLoadScore(site) {
  const summary = window.companyData?.getSummary?.() || {};
  const model = summary.model || {};
  return site?.status === 'crit' ? 72 : site?.status === 'warn' ? 82 : site?.status === 'info' ? 78 : (model.health_score ?? 88);
}

function scaledStages(site) {
  const plant = window.companyData?.getPlant?.() || window.PLANT;
  const ratio = site?.summary?.power_kw ? site.summary.power_kw / 4182 : 1;
  return plant.stages.map(s => ({ ...s, kw: s.kw > 0 ? Math.round(s.kw * ratio) : s.kw }));
}

function buildMetricDetail(site, metricKey) {
  const defs = window.METRIC_DEFINITIONS || {};
  const plantKpis = site?.kpis || window.PLANT.kpis;
  if (metricKey && metricKey.startsWith('stage:')) {
    const stageId = metricKey.replace('stage:', '');
    const stage = scaledStages(site).find(s => s.id === stageId) || scaledStages(site)[0];
    const tone = stage.state === 'warn' ? 'warn' : stage.state === 'crit' ? 'crit' : 'ok';
    return {
      label: `${stage.name}用電`,
      value: stage.kw > 0 ? stage.kw.toLocaleString() : '—',
      unit: stage.kw > 0 ? 'kW' : '',
      delta: stage.state === 'warn' ? '警告' : '正常',
      tone,
      samples: [stage.kw*.84, stage.kw*.9, stage.kw*.88, stage.kw*.94, stage.kw*.97, stage.kw],
      short: `${stage.name}節點代表淨水流程中該製程主要設備的即時用電,需與下方水量或水質指標一起判讀。`,
      range: stage.flow,
      source: `製程狀態 API / ${stage.name} 相關設備 Tag`,
      formula: '相關設備即時功率加總(kW)',
      why: '用來判斷是哪一個製程造成全廠用電變化,避免只看總用電而不知道問題位置。',
      action: stage.state === 'warn' ? '優先檢查該製程設備負載、控制設定與最近告警。' : '維持監控,若與總用電趨勢同步偏移再進一步追查。',
    };
  }
  if (metricKey === 'health_score') {
    const value = currentLoadScore(site);
    return {
      ...(defs.health_score || {}),
      label: '設備平均負載',
      value: String(value),
      unit: '%',
      delta: site?.statusText || '正常',
      tone: value < 75 ? 'warn' : 'info',
      samples: [74,78,80,81,value-1,value],
    };
  }
  if (metricKey === 'model_r2') {
    return {
      ...(defs.model_r2 || {}),
      label: '模型 R²',
      value: '0.94',
      unit: '',
      delta: 'M-015',
      tone: 'violet',
      samples: [.88,.9,.91,.93,.94,.94],
    };
  }
  const def = defs[metricKey] || defs.sec || {};
  const kpi = plantKpis[metricKey] || plantKpis.sec || {};
  return {
    ...def,
    label: def.label || kpi.label,
    value: kpi.value || '—',
    unit: kpi.unit || '',
    delta: kpi.delta || '—',
    tone: kpi.tone || 'info',
    samples: KPI_SPARKS[metricKey] || KPI_SPARKS.sec,
  };
}

  );
}

function FallbackMap({ sites, selectedId, onSelect }) {
  const lngs = sites.map(s => s.lng), lats = sites.map(s => s.lat);
  const minLng = Math.min(...lngs), maxLng = Math.max(...lngs), minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const x = s => 10 + ((s.lng - minLng) / ((maxLng - minLng) || 1)) * 80;
  const y = s => 82 - ((s.lat - minLat) / ((maxLat - minLat) || 1)) * 66;

function mapTone(status) {
  return status === 'crit' ? 'crit' : status === 'warn' ? 'warn' : status === 'info' ? 'info' : 'ok';
}

function addMapNetworkLayer(map, sites) {
  if (!map || !map.isStyleLoaded?.()) return;
  const center = sites[0];
  const data = {
    type: 'FeatureCollection',
    features: sites.slice(1).map(site => ({
      type: 'Feature',
      properties: { id: `${center.id}-${site.id}` },
      geometry: { type: 'LineString', coordinates: [[center.lng, center.lat], [site.lng, site.lat]] },
    })),
  };
  if (map.getSource('waterworks-network')) {
    map.getSource('waterworks-network').setData(data);
    return;
  }
  map.addSource('waterworks-network', { type:'geojson', data });
  map.addLayer({
    id:'waterworks-network-glow',
    type:'line',
    source:'waterworks-network',
    paint:{ 'line-color':'#22D3EE', 'line-width':7, 'line-opacity':0.16, 'line-blur':2 },
  });
  map.addLayer({
    id:'waterworks-network-line',
    type:'line',
    source:'waterworks-network',
    paint:{ 'line-color':'#22D3EE', 'line-width':1.8, 'line-opacity':0.68, 'line-dasharray':[2, 1.3] },
  });
}

function WaterworksMapPanel({ sites, selectedId, onSelect }) {
  const { Panel, PanelHeader, InfoHint } = window;
  const viewport = window.useViewport ? window.useViewport() : { isMobile:false };

  const selected = sites.find(s => s.id === selectedId) || sites[0];
  const mapEl = React.useRef(null);
  const mapRef = React.useRef(null);
  const markersRef = React.useRef([]);
  const [mapReady, setMapReady] = React.useState(false);
  const [mapError, setMapError] = React.useState(false);
  const [styleId, setStyleId] = React.useState('nav');
  const hasMapbox = Boolean(window.mapboxgl && window.MAPBOX_ACCESS_TOKEN);
  const style = MAP_STYLE_OPTIONS.find(opt => opt.id === styleId) || MAP_STYLE_OPTIONS[0];

  React.useEffect(() => {
    if (!hasMapbox || !mapEl.current || mapRef.current) return;
    try {
      window.mapboxgl.accessToken = window.MAPBOX_ACCESS_TOKEN;
      mapRef.current = new window.mapboxgl.Map({
        container: mapEl.current,
        style: style.url || window.MAPBOX_CONFIG?.style || 'mapbox://styles/mapbox/navigation-night-v1',
        center: [selected.lng, selected.lat],
        zoom: 8.6,
        pitch: 28,

        attributionControl: false,
      });
      mapRef.current.addControl(new window.mapboxgl.NavigationControl({ showCompass:false }), 'bottom-right');
      mapRef.current.on('load', () => {
        setMapReady(true);
        addMapNetworkLayer(mapRef.current, sites);
      });
      const ro = new ResizeObserver(() => mapRef.current?.resize());
      ro.observe(mapEl.current);
      setTimeout(() => mapRef.current?.resize(), 250);
      mapRef.current.__nhrResizeObserver = ro;
    } catch (err) {
      setMapError(true);
    }
    return () => {
      markersRef.current.forEach(m => m.remove());
      markersRef.current = [];
      mapRef.current?.__nhrResizeObserver?.disconnect?.();
      mapRef.current?.remove();
      mapRef.current = null;
    };
  }, [hasMapbox]);

  React.useEffect(() => {
    const map = mapRef.current;
    if (!map || !mapReady) return;
    setMapReady(false);
    map.setStyle(style.url);
    map.once('style.load', () => {
      setMapReady(true);
      addMapNetworkLayer(map, sites);

  }, [styleId]);

  React.useEffect(() => {

      ].join(';');
      el.addEventListener('click', () => onSelect(site.id));
      return new window.mapboxgl.Marker(el).setLngLat([site.lng, site.lat]).addTo(map);
    });
    addMapNetworkLayer(map, sites);
    map.flyTo({ center:[selected.lng, selected.lat], zoom: selected.id === 'WTP2' ? 10.1 : 9.2, pitch:28, bearing:-12, speed:.75, essential:true });

      <div style={{ padding:isMobile ? 9 : 12 }}>

          border:'1px solid var(--border-strong)', background:'var(--bg-inset)', boxShadow:'inset 0 1px 0 rgba(255,255,255,.05)' }}>
          {hasMapbox && !mapError
            ? <div ref={mapEl} style={{ position:'absolute', inset:0 }}/>
            : <FallbackMap sites={sites} selectedId={selectedId} onSelect={onSelect}/>}
          <div style={{ position:'absolute', inset:0, pointerEvents:'none',

function buildTrendData(range, site) {
  const plant = window.companyData?.getPlant?.() || window.PLANT;
  const sample = window.companyData?.getSample?.() || window.SAMPLE;
  const ratio = site?.summary?.power_kw ? site.summary.power_kw / 4182 : 1;
  if (range === '7D') {
    const rows = (sample.dailySummary || []).slice(-7);
    const actual = rows.map(r => Number(r[2]) * ratio);
    const predicted = rows.map(r => Number(r[3]) * Number(r[5]) / 1000 * ratio);
    return {
      unit: 'MWh/日',
      xTicks: rows.map(r => String(r[0]).slice(5)),
      actual,
      predicted,
      bandHi: predicted.map(v => v * 1.04),
      bandLo: predicted.map(v => v * 0.96),
      markers: site?.status === 'crit' ? [{ i: actual.length - 1, n: actual.length, tone:'crit' }] : [],
    };
  }
  if (range === '30D') {
    const actual = Array.from({ length:30 }, (_, i) => {
      const seasonal = Math.sin(i / 30 * Math.PI * 2) * 7;
      const drift = i > 22 ? (i - 22) * 0.65 : 0;
      return (92 + seasonal + drift + Math.cos(i * 1.2) * 2.2) * ratio;
    });
    const predicted = actual.map((v, i) => (90 + Math.sin(i / 30 * Math.PI * 2) * 6.4) * ratio);
    return {
      unit: 'MWh/日',
      xTicks: ['D-29','D-24','D-18','D-12','D-6','今天'],
      actual,
      predicted,
      bandHi: predicted.map(v => v * 1.05),
      bandLo: predicted.map(v => v * 0.95),
      markers: [{ i:27, n:30, tone: site?.status === 'crit' ? 'crit' : 'warn' }],
    };
  }
  const e = plant.energy24h;
  return {
    unit: 'kW',
    xTicks: e.xTicks,
    actual: e.actual.map(v => Math.round(v * ratio)),
    predicted: e.predicted.map(v => Math.round(v * ratio)),
    bandHi: e.bandHi.map(v => Math.round(v * ratio)),
    bandLo: e.bandLo.map(v => Math.round(v * ratio)),
    markers: e.markers,
  };
}

// ScreenModeling.jsx — AI analysis & modeling: model registry, graphical pipeline, evaluation, saving advice.

const PIPE_TONE = (i, active) => i < active ? 'ok' : i === active ? 'info' : 'mute';

function Pipeline({ step, setStep, activeIdx }) {

      <div style={{ padding:'16px 14px 8px', display:'flex', alignItems:'flex-start' }}>
        {steps.map((s,i) => {
          const tone = PIPE_TONE(i, activeIdx);
          const c = window.TONE[tone];
          const Icon = NHRIcons[s.icon] || NHRIcons.Dot;
          const on = step===i;
          const done = i < activeIdx;
          return (
            <React.Fragment key={s.id}>
              <button onClick={()=>setStep(i)} style={{ all:'unset', cursor:'pointer', flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:7, minWidth:0 }}>

                <div style={{ textAlign:'center' }}>

              </button>

                <div style={{ flex:'0 0 18px', marginTop:22, display:'flex', alignItems:'center', justifyContent:'center' }}>

              )}
            </React.Fragment>
          );

      </div>
      <div style={{ margin:'4px 14px 14px', padding:'11px 13px', background:'var(--bg-inset)', borderRadius:8,
        display:'flex', alignItems:'center', gap:14 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>

}

function EvalPanel({ model }) {

}

function Legend2({ tone, label, dash, band }) {
  const c = window.TONE[tone];
  return <span style={{ display:'inline-flex', alignItems:'center', gap:5, fontSize:10.5, color:'var(--fg-2)' }}>
    {band ? <span style={{ width:14, height:9, background:`${c}33`, border:`1px solid ${c}66`, borderRadius:2 }}/>

}

function AdvicePanel() {
  const { Panel, PanelHeader, NHRIcons, Chip } = window;
  const advice = [
    { item:'P-201 配水泵運轉點偏離高效區', cause:'轉速設定偏高,落在泵浦特性曲線右側', dir:'下修轉速 4%,改由 P-203 分攤流量', save:'4.8%', risk:'低', confirm:true, tone:'warn' },
    { item:'AC-401 空壓機比能耗上升', cause:'進氣濾網阻塞造成壓損增加', dir:'清潔 / 更換進氣濾網', save:'3.1%', risk:'低', confirm:true, tone:'crit' },

        {advice.map((a,i) => (
          <div key={i} style={{ padding:'11px 12px', background:'var(--bg-inset)', borderRadius:9, borderLeft:`2px solid ${window.TONE[a.tone]}` }}>
            <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8 }}>
              <span style={{ fontSize:12.5, color:'var(--fg-1)', fontWeight:600, lineHeight:1.35 }}>{a.item}</span>
              <Chip tone="ok" solid>省 {a.save}</Chip>

              <Row k="可能原因" v={a.cause}/>

                <span style={{ fontSize:10.5, color:'var(--fg-3)' }}>風險 <b style={{ color:window.TONE[a.risk==='中'?'warn':'ok'], fontFamily:'var(--font-mono)' }}>{a.risk}</b></span>
                <span style={{ fontSize:10.5, color:'var(--fg-3)' }}>需人工確認 <b style={{ color:'var(--status-warn)' }}>是</b></span>

          <span style={{ width:12, height:12 }}><NHRIcons.Lock/></span>建議僅供決策參考,需經授權確認,系統不自動變更 PLC 控制參數
        </div>
      </div>
    </Panel>
  );
}

function Row({ k, v }) {
  return <div style={{ display:'flex', gap:8 }}>
    <span style={{ fontSize:10.5, color:'var(--fg-3)', flexShrink:0, width:52 }}>{k}</span>
    <span style={{ fontSize:11, color:'var(--fg-2)', lineHeight:1.4 }}>{v}</span>

function ScreenModeling() {
  const models = window.companyData?.getModels?.() || window.MODELS;
  const [selId, setSelId] = React.useState(models[0]?.id);
  const [step, setStep] = React.useState(7);
  React.useEffect(() => {
    if (!models.some(m => m.id === selId)) setSelId(models[0]?.id);

  const model = models.find(m => m.id===selId) || models[0];
  return (

function seedWave(n, base, amp, noise, ph=0){ return Array.from({length:n},(_,i)=>base+Math.sin(i/n*Math.PI*2+ph)*amp+(Math.sin(i*1.7)+Math.cos(i*0.9))*noise); }
const REP_HOURLY_ACTUAL = seedWave(24,3900,520,70,.3).map((v,i)=>i>=20?v+220:v);
const REP_HOURLY_PRED   = seedWave(24,3840,480,30,.3);
const REP_AREA = [
  { label:'配水加壓', value:2438, tone:'info' },
  { label:'取水', value:612, tone:'ok' },
  { label:'混凝沉澱', value:248, tone:'violet' },
  { label:'快濾', value:196, tone:'lime' },
  { label:'消毒', value:88, tone:'warn' },
  { label:'其他', value:108, tone:'magenta' },
];
const REP_SCATTER = Array.from({length:26},(_,i)=>{ const flow=12800+i*110+Math.sin(i*1.3)*180; const pw=flow*0.27+Math.sin(i*0.7)*90+ (i>22?260:0); return [Math.round(flow), Math.round(pw)]; });
const REP_SEC_DIST = Array.from({length:80},(_,i)=>0.284+Math.sin(i*1.9)*0.018+Math.cos(i*0.6)*0.011+(i%17===0?0.02:0));
const REP_HEAT = Array.from({length:7},(_,r)=>Array.from({length:24},(_,c)=>{ const peak=(c>=7&&c<=10)||(c>=17&&c<=20)?1:0.4; const wk=r>=5?0.7:1; return Math.min(1, peak*wk*(0.55+0.35*Math.sin((c+r)*0.7)+0.1)); }));

const REPORTS = [
